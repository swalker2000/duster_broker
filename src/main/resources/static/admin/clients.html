<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Админ — клиенты</title>
    <script src="/admin/admin-i18n.js"></script>
    <link rel="stylesheet" href="/admin/admin-common.css">
</head>
<body data-i18n-document-title="clients.documentTitle">
<header>
    <div class="header-row">
        <h1 data-i18n="clients.header">Клиенты и устройства</h1>
        <div id="lang-switch"></div>
    </div>
    <p data-i18n-html="clients.subtitle"></p>
    <nav class="admin-nav" data-i18n-aria-label="common.navAria">
        <a href="/admin/clients.html" class="active" data-i18n="nav.clients">Клиенты и устройства</a>
        <a href="/admin/messages.html" data-i18n="nav.messages">Сообщения</a>
        <a href="/admin/saved-messages.html" data-i18n="nav.saved">Сохраняемые</a>
    </nav>
    <p id="user-line" style="margin-top:0.75rem;font-size:0.875rem;color:var(--muted);"></p>
    <button type="button" class="secondary" id="logout-btn" style="margin-top:0.5rem;" data-i18n="common.logout">Выйти</button>
</header>
<main>
    <div id="flash" class="msg" role="alert"></div>

    <section class="card">
        <h2 id="form-title" data-i18n="clients.formNew">Новый клиент</h2>
        <form id="client-form">
            <input type="hidden" id="edit-id" value="">
            <div class="row">
                <div>
                    <label for="deviseId" data-i18n="clients.deviseIdLabel">deviseId (уникальный)</label>
                    <input id="deviseId" required autocomplete="off" data-i18n-placeholder="clients.deviseIdPh">
                </div>
                <div>
                    <label for="password" data-i18n="clients.passwordLabel">Пароль</label>
                    <input id="password" type="password" required autocomplete="new-password" data-i18n-placeholder="clients.passwordPh">
                </div>
            </div>
            <div class="row">
                <div>
                    <label for="role" data-i18n="clients.role">Роль</label>
                    <select id="role">
                        <option value="DEVISE">DEVISE</option>
                        <option value="MAN">MAN</option>
                    </select>
                </div>
                <div>
                    <label for="description" data-i18n="clients.description">Описание</label>
                    <input id="description" required data-i18n-placeholder="clients.descriptionPh">
                </div>
            </div>
            <div class="actions">
                <button type="submit" class="primary" id="submit-btn" data-i18n="clients.create">Создать</button>
                <button type="button" class="secondary" id="reset-btn" data-i18n="clients.resetForm">Сбросить форму</button>
            </div>
        </form>
    </section>

    <section class="card">
        <h2 data-i18n="clients.list">Список</h2>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                <tr>
                    <th data-i18n="clients.colId">ID</th>
                    <th data-i18n="clients.colDeviseId">deviseId</th>
                    <th data-i18n="clients.colPassword">Пароль</th>
                    <th data-i18n="clients.colRole">Роль</th>
                    <th data-i18n="clients.colDescription">Описание</th>
                    <th></th>
                </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
        <p id="empty-hint" style="color: var(--muted); display: none;" data-i18n="clients.empty">Записей нет.</p>
    </section>
</main>

<script>
    DusterI18n.applyI18n(document.body);
    DusterI18n.mountLangSwitch(document.getElementById('lang-switch'));

    const TOKEN_KEY = 'dusterAdminJwt';
    const API = '/admin/api/clients';
    const tbody = document.getElementById('tbody');
    const flash = document.getElementById('flash');
    const form = document.getElementById('client-form');
    const editId = document.getElementById('edit-id');
    const formTitle = document.getElementById('form-title');
    const submitBtn = document.getElementById('submit-btn');
    const emptyHint = document.getElementById('empty-hint');
    const userLine = document.getElementById('user-line');

    function getToken() {
        return sessionStorage.getItem(TOKEN_KEY);
    }

    function authHeaders() {
        const t = getToken();
        const h = { 'Content-Type': 'application/json' };
        if (t) h['Authorization'] = 'Bearer ' + t;
        return h;
    }

    async function apiFetch(url, options) {
        const opts = options || {};
        const headers = new Headers(opts.headers || {});
        const t = getToken();
        if (t) headers.set('Authorization', 'Bearer ' + t);
        return fetch(url, Object.assign({}, opts, { headers: headers }));
    }

    function redirectToLogin(reason) {
        sessionStorage.removeItem(TOKEN_KEY);
        const q = reason ? ('?reason=' + encodeURIComponent(reason)) : '';
        location.href = '/admin/login.html' + q;
    }

    async function ensureManSession() {
        const t = getToken();
        if (!t) {
            redirectToLogin();
            return false;
        }
        const r = await fetch('/auth/me', { headers: { 'Authorization': 'Bearer ' + t } });
        if (!r.ok) {
            redirectToLogin();
            return false;
        }
        const me = await r.json();
        if (me.role !== 'MAN') {
            redirectToLogin('forbidden');
            return false;
        }
        userLine.textContent = DusterI18n.t('common.loggedInAs', { id: me.deviseId });
        return true;
    }

    document.getElementById('logout-btn').addEventListener('click', () => redirectToLogin());

    function showFlash(text, ok) {
        flash.textContent = text;
        flash.className = 'msg ' + (ok ? 'ok' : 'err');
        if (ok) setTimeout(() => { flash.className = 'msg'; flash.textContent = ''; }, 3500);
    }

    async function loadList() {
        const r = await apiFetch(API);
        if (r.status === 401 || r.status === 403) {
            redirectToLogin(r.status === 403 ? 'forbidden' : '');
            return;
        }
        if (!r.ok) {
            showFlash(DusterI18n.t('clients.flashLoadErr', { status: r.status }), false);
            return;
        }
        const list = await r.json();
        tbody.innerHTML = '';
        emptyHint.style.display = list.length ? 'none' : 'block';
        for (const c of list) {
            const tr = document.createElement('tr');
            tr.innerHTML =
                '<td>' + c.id + '</td>' +
                '<td><code>' + escapeHtml(c.deviseId) + '</code></td>' +
                '<td>••••••••</td>' +
                '<td><span class="badge">' + escapeHtml(c.role) + '</span></td>' +
                '<td>' + escapeHtml(c.description) + '</td>' +
                '<td class="table-actions">' +
                '<button type="button" class="secondary btn-edit" data-id="' + c.id + '">' + escapeHtml(DusterI18n.t('clients.edit')) + '</button>' +
                '<button type="button" class="danger btn-del" data-id="' + c.id + '">' + escapeHtml(DusterI18n.t('clients.del')) + '</button>' +
                '</td>';
            tbody.appendChild(tr);
        }
        tbody.querySelectorAll('.btn-edit').forEach(b => b.addEventListener('click', () => startEdit(+b.dataset.id, list)));
        tbody.querySelectorAll('.btn-del').forEach(b => b.addEventListener('click', () => removeClient(+b.dataset.id)));
    }

    function escapeHtml(s) {
        if (s == null) return '';
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }

    function startEdit(id, list) {
        const c = list.find(x => x.id === id);
        if (!c) return;
        editId.value = String(c.id);
        document.getElementById('deviseId').value = c.deviseId;
        document.getElementById('password').value = '';
        document.getElementById('password').required = false;
        document.getElementById('role').value = c.role;
        document.getElementById('description').value = c.description;
        formTitle.textContent = DusterI18n.t('clients.formEdit', { id: c.id });
        submitBtn.textContent = DusterI18n.t('clients.save');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
        editId.value = '';
        form.reset();
        document.getElementById('password').required = true;
        formTitle.textContent = DusterI18n.t('clients.formNew');
        submitBtn.textContent = DusterI18n.t('clients.create');
    }

    document.getElementById('reset-btn').addEventListener('click', resetForm);

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = editId.value;
        const pwd = document.getElementById('password').value;
        if (!id && !pwd) {
            showFlash(DusterI18n.t('clients.flashNeedPassword'), false);
            return;
        }
        const body = {
            deviseId: document.getElementById('deviseId').value.trim(),
            password: pwd,
            role: document.getElementById('role').value,
            description: document.getElementById('description').value.trim()
        };
        const opts = {
            headers: authHeaders(),
            body: JSON.stringify(body)
        };
        let r;
        if (id) {
            r = await apiFetch(API + '/' + id, { method: 'PUT', ...opts });
        } else {
            r = await apiFetch(API, { method: 'POST', ...opts });
        }
        if (r.status === 401 || r.status === 403) {
            redirectToLogin(r.status === 403 ? 'forbidden' : '');
            return;
        }
        if (!r.ok) {
            let msg = r.status + ' ' + r.statusText;
            try {
                const err = await r.json();
                if (err.message) msg = err.message;
                else if (err.error) msg = err.error;
            } catch (_) {}
            showFlash(msg, false);
            return;
        }
        showFlash(id ? DusterI18n.t('clients.flashSaved') : DusterI18n.t('clients.flashCreated'), true);
        resetForm();
        await loadList();
    });

    async function removeClient(id) {
        if (!confirm(DusterI18n.t('clients.confirmDelete', { id: id }))) return;
        const r = await apiFetch(API + '/' + id, { method: 'DELETE' });
        if (r.status === 401 || r.status === 403) {
            redirectToLogin(r.status === 403 ? 'forbidden' : '');
            return;
        }
        if (!r.ok && r.status !== 204) {
            showFlash(DusterI18n.t('clients.flashDeleteFail', { status: r.status }), false);
            return;
        }
        showFlash(DusterI18n.t('clients.flashDeleted'), true);
        await loadList();
    }

    (async function init() {
        if (!(await ensureManSession())) return;
        await loadList();
    })();
</script>
</body>
</html>
