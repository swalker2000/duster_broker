<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Админ — клиенты и устройства</title>
    <link rel="stylesheet" href="/admin/admin-common.css">
</head>
<body>
<header>
    <h1>Клиенты и устройства</h1>
    <p>CRUD для сущности <code>Client</code> — REST: <code>/admin/api/clients</code> (JWT, роль MAN)</p>
    <nav class="admin-nav" aria-label="Разделы админки">
        <a href="/admin/clients.html" class="active">Клиенты и устройства</a>
        <a href="/admin/messages.html">Сообщения</a>
    </nav>
    <p id="user-line" style="margin-top:0.75rem;font-size:0.875rem;color:var(--muted);"></p>
    <button type="button" class="secondary" id="logout-btn" style="margin-top:0.5rem;">Выйти</button>
</header>
<main>
    <div id="flash" class="msg" role="alert"></div>

    <section class="card">
        <h2 id="form-title">Новый клиент</h2>
        <form id="client-form">
            <input type="hidden" id="edit-id" value="">
            <div class="row">
                <div>
                    <label for="deviseId">deviseId (уникальный)</label>
                    <input id="deviseId" required autocomplete="off" placeholder="например device-001">
                </div>
                <div>
                    <label for="password">Пароль</label>
                    <input id="password" type="password" required autocomplete="new-password" placeholder="при создании обязателен; при правке — пусто = не менять">
                </div>
            </div>
            <div class="row">
                <div>
                    <label for="role">Роль</label>
                    <select id="role">
                        <option value="DEVISE">DEVISE</option>
                        <option value="MAN">MAN</option>
                    </select>
                </div>
                <div>
                    <label for="description">Описание</label>
                    <input id="description" required placeholder="что за устройство / пользователь">
                </div>
            </div>
            <div class="actions">
                <button type="submit" class="primary" id="submit-btn">Создать</button>
                <button type="button" class="secondary" id="reset-btn">Сбросить форму</button>
            </div>
        </form>
    </section>

    <section class="card">
        <h2>Список</h2>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>deviseId</th>
                    <th>Пароль</th>
                    <th>Роль</th>
                    <th>Описание</th>
                    <th></th>
                </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
        <p id="empty-hint" style="color: var(--muted); display: none;">Записей нет.</p>
    </section>
</main>

<script>
    const TOKEN_KEY = 'dusterAdminJwt';
    const API = '/admin/api/clients';
    const tbody = document.getElementById('tbody');
    const flash = document.getElementById('flash');
    const form = document.getElementById('client-form');
    const editId = document.getElementById('edit-id');
    const formTitle = document.getElementById('form-title');
    const submitBtn = document.getElementById('submit-btn');
    const emptyHint = document.getElementById('empty-hint');
    const userLine = document.getElementById('user-line');

    function getToken() {
        return sessionStorage.getItem(TOKEN_KEY);
    }

    function authHeaders() {
        const t = getToken();
        const h = { 'Content-Type': 'application/json' };
        if (t) h['Authorization'] = 'Bearer ' + t;
        return h;
    }

    async function apiFetch(url, options) {
        const opts = options || {};
        const headers = new Headers(opts.headers || {});
        const t = getToken();
        if (t) headers.set('Authorization', 'Bearer ' + t);
        return fetch(url, Object.assign({}, opts, { headers: headers }));
    }

    function redirectToLogin(reason) {
        sessionStorage.removeItem(TOKEN_KEY);
        const q = reason ? ('?reason=' + encodeURIComponent(reason)) : '';
        location.href = '/admin/login.html' + q;
    }

    async function ensureManSession() {
        const t = getToken();
        if (!t) {
            redirectToLogin();
            return false;
        }
        const r = await fetch('/auth/me', { headers: { 'Authorization': 'Bearer ' + t } });
        if (!r.ok) {
            redirectToLogin();
            return false;
        }
        const me = await r.json();
        if (me.role !== 'MAN') {
            redirectToLogin('forbidden');
            return false;
        }
        userLine.textContent = 'Вы вошли как ' + me.deviseId + ' (MAN)';
        return true;
    }

    document.getElementById('logout-btn').addEventListener('click', () => redirectToLogin());

    function showFlash(text, ok) {
        flash.textContent = text;
        flash.className = 'msg ' + (ok ? 'ok' : 'err');
        if (ok) setTimeout(() => { flash.className = 'msg'; flash.textContent = ''; }, 3500);
    }

    async function loadList() {
        const r = await apiFetch(API);
        if (r.status === 401 || r.status === 403) {
            redirectToLogin(r.status === 403 ? 'forbidden' : '');
            return;
        }
        if (!r.ok) {
            showFlash('Ошибка загрузки: ' + r.status, false);
            return;
        }
        const list = await r.json();
        tbody.innerHTML = '';
        emptyHint.style.display = list.length ? 'none' : 'block';
        for (const c of list) {
            const tr = document.createElement('tr');
            tr.innerHTML =
                '<td>' + c.id + '</td>' +
                '<td><code>' + escapeHtml(c.deviseId) + '</code></td>' +
                '<td>••••••••</td>' +
                '<td><span class="badge">' + escapeHtml(c.role) + '</span></td>' +
                '<td>' + escapeHtml(c.description) + '</td>' +
                '<td class="table-actions">' +
                '<button type="button" class="secondary btn-edit" data-id="' + c.id + '">Изменить</button>' +
                '<button type="button" class="danger btn-del" data-id="' + c.id + '">Удалить</button>' +
                '</td>';
            tbody.appendChild(tr);
        }
        tbody.querySelectorAll('.btn-edit').forEach(b => b.addEventListener('click', () => startEdit(+b.dataset.id, list)));
        tbody.querySelectorAll('.btn-del').forEach(b => b.addEventListener('click', () => removeClient(+b.dataset.id)));
    }

    function escapeHtml(s) {
        if (s == null) return '';
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }

    function startEdit(id, list) {
        const c = list.find(x => x.id === id);
        if (!c) return;
        editId.value = String(c.id);
        document.getElementById('deviseId').value = c.deviseId;
        document.getElementById('password').value = '';
        document.getElementById('password').required = false;
        document.getElementById('role').value = c.role;
        document.getElementById('description').value = c.description;
        formTitle.textContent = 'Редактирование #' + c.id;
        submitBtn.textContent = 'Сохранить';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
        editId.value = '';
        form.reset();
        document.getElementById('password').required = true;
        formTitle.textContent = 'Новый клиент';
        submitBtn.textContent = 'Создать';
    }

    document.getElementById('reset-btn').addEventListener('click', resetForm);

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = editId.value;
        const pwd = document.getElementById('password').value;
        if (!id && !pwd) {
            showFlash('Укажите пароль для нового клиента', false);
            return;
        }
        const body = {
            deviseId: document.getElementById('deviseId').value.trim(),
            password: pwd,
            role: document.getElementById('role').value,
            description: document.getElementById('description').value.trim()
        };
        const opts = {
            headers: authHeaders(),
            body: JSON.stringify(body)
        };
        let r;
        if (id) {
            r = await apiFetch(API + '/' + id, { method: 'PUT', ...opts });
        } else {
            r = await apiFetch(API, { method: 'POST', ...opts });
        }
        if (r.status === 401 || r.status === 403) {
            redirectToLogin(r.status === 403 ? 'forbidden' : '');
            return;
        }
        if (!r.ok) {
            let msg = r.status + ' ' + r.statusText;
            try {
                const err = await r.json();
                if (err.message) msg = err.message;
                else if (err.error) msg = err.error;
            } catch (_) {}
            showFlash(msg, false);
            return;
        }
        showFlash(id ? 'Сохранено' : 'Создано', true);
        resetForm();
        await loadList();
    });

    async function removeClient(id) {
        if (!confirm('Удалить клиента #' + id + '?')) return;
        const r = await apiFetch(API + '/' + id, { method: 'DELETE' });
        if (r.status === 401 || r.status === 403) {
            redirectToLogin(r.status === 403 ? 'forbidden' : '');
            return;
        }
        if (!r.ok && r.status !== 204) {
            showFlash('Удаление не удалось: ' + r.status, false);
            return;
        }
        showFlash('Удалено', true);
        await loadList();
    }

    (async function init() {
        if (!(await ensureManSession())) return;
        await loadList();
    })();
</script>
</body>
</html>
