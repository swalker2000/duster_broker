<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Админ — сообщения</title>
    <script src="/admin/admin-i18n.js"></script>
    <link rel="stylesheet" href="/admin/admin-common.css">
    <style>
        #messages-tbody tr.msg-row-clickable { cursor: pointer; }
        #messages-tbody tr.msg-row-clickable:hover td { background: rgba(61, 139, 253, 0.06); }
        #messages-tbody tr.msg-row-selected td { background: rgba(61, 139, 253, 0.1); }
        #messages-tbody tr.msg-row-selected td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
    </style>
</head>
<body data-i18n-document-title="messages.documentTitle">
<header>
    <div class="header-row">
        <h1 data-i18n="messages.header">Сообщения</h1>
        <div id="lang-switch"></div>
    </div>
    <p data-i18n-html="messages.subtitle"></p>
    <nav class="admin-nav" data-i18n-aria-label="common.navAria">
        <a href="/admin/clients.html" data-i18n="nav.clients">Клиенты и устройства</a>
        <a href="/admin/messages.html" class="active" data-i18n="nav.messages">Сообщения</a>
        <a href="/admin/saved-messages.html" data-i18n="nav.saved">Сохраняемые</a>
    </nav>
    <p id="user-line" style="margin-top:0.75rem;font-size:0.875rem;color:var(--muted);"></p>
    <button type="button" class="secondary" id="logout-btn" style="margin-top:0.5rem;" data-i18n="common.logout">Выйти</button>
</header>
<main>
    <div id="flash" class="msg" role="alert"></div>

    <section class="card">
        <h2 data-i18n="messages.sendTitle">Отправка сообщения на устройство</h2>
        <p style="color: var(--muted); font-size: 0.875rem; margin: 0 0 1rem;" data-i18n-html="messages.sendHint"></p>
        <form id="send-form">
            <div class="row">
                <div>
                    <label for="send-device" data-i18n="messages.device">Устройство (роль DEVISE)</label>
                    <select id="send-device" required>
                        <option value="" data-i18n="messages.choose">— выберите —</option>
                    </select>
                </div>
                <div>
                    <label for="send-guarantee" data-i18n="messages.guarantee">Гарантия доставки</label>
                    <select id="send-guarantee">
                        <option value="RECEIPT_CONFIRMATION" selected>RECEIPT_CONFIRMATION</option>
                        <option value="ONLY_LAST">ONLY_LAST</option>
                        <option value="NO">NO</option>
                    </select>
                </div>
            </div>
            <label for="send-command" data-i18n="messages.command">Команда (command)</label>
            <input id="send-command" required autocomplete="off" data-i18n-placeholder="messages.commandPh">
            <label for="send-data" data-i18n="messages.data">Данные (JSON-объект, необязательно)</label>
            <textarea id="send-data" data-i18n-placeholder="messages.dataPh"></textarea>
            <div class="actions">
                <button type="submit" class="primary" id="send-btn" data-i18n="messages.send">Отправить</button>
                <button type="button" class="secondary" id="send-stop-poll" disabled data-i18n="messages.stopPoll">Остановить опрос статуса</button>
            </div>
        </form>
        <div id="send-status-panel" style="margin-top: 1rem; display: none;">
            <p class="status-line" id="send-msg-id"></p>
            <p class="status-line" id="send-delivery-status"></p>
            <p class="status-line" id="send-poll-hint" style="color: var(--muted);"></p>
        </div>
    </section>

    <section class="card">
        <h2 data-i18n="messages.sentTitle">Отправленные сообщения</h2>
        <p style="color: var(--muted); font-size: 0.875rem; margin: 0 0 1rem;" data-i18n-html="messages.sentHint"></p>
        <div class="row" style="margin-bottom: 0.75rem;">
            <div>
                <label for="msg-filter-device" data-i18n="messages.filterDevice">Фильтр по устройству</label>
                <select id="msg-filter-device">
                    <option value="" data-i18n="messages.allDevices">Все устройства</option>
                </select>
            </div>
            <div>
                <label for="msg-limit" data-i18n="messages.limit">Сколько записей</label>
                <select id="msg-limit">
                    <option value="100">100</option>
                    <option value="200" selected>200</option>
                    <option value="500">500</option>
                </select>
            </div>
        </div>
        <div class="actions" style="margin-bottom: 1rem;">
            <button type="button" class="primary" id="msg-refresh-btn" data-i18n="messages.refresh">Обновить список</button>
        </div>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                <tr>
                    <th data-i18n="messages.colId">ID</th>
                    <th data-i18n="messages.colDevice">Устройство</th>
                    <th data-i18n="messages.colCommand">Команда</th>
                    <th data-i18n="messages.colStatus">Статус</th>
                    <th data-i18n="messages.colGuarantee">Гарантия</th>
                    <th data-i18n="messages.colCreated">Создано</th>
                    <th data-i18n="messages.colDelivered">Доставлено</th>
                    <th data-i18n="messages.colError">Ошибка</th>
                    <th data-i18n="messages.colData">Данные</th>
                </tr>
                </thead>
                <tbody id="messages-tbody"></tbody>
            </table>
        </div>
        <p id="messages-empty" style="color: var(--muted); display: none;" data-i18n="messages.empty">Сообщений нет</p>
    </section>
</main>

<script>
    DusterI18n.applyI18n(document.body);
    DusterI18n.mountLangSwitch(document.getElementById('lang-switch'));

    const TOKEN_KEY = 'dusterAdminJwt';
    const API_CLIENTS = '/admin/api/clients';
    const API_MESSAGES = '/admin/api/messages';
    const flash = document.getElementById('flash');
    const userLine = document.getElementById('user-line');
    const sendDevice = document.getElementById('send-device');
    const sendForm = document.getElementById('send-form');
    const sendBtn = document.getElementById('send-btn');
    const sendStopPoll = document.getElementById('send-stop-poll');
    const sendStatusPanel = document.getElementById('send-status-panel');
    const sendMsgIdEl = document.getElementById('send-msg-id');
    const sendDeliveryStatusEl = document.getElementById('send-delivery-status');
    const sendPollHintEl = document.getElementById('send-poll-hint');
    const msgFilterDevice = document.getElementById('msg-filter-device');
    const msgLimit = document.getElementById('msg-limit');
    const messagesTbody = document.getElementById('messages-tbody');
    const messagesEmpty = document.getElementById('messages-empty');
    const msgRefreshBtn = document.getElementById('msg-refresh-btn');
    const sendGuaranteeEl = document.getElementById('send-guarantee');
    const sendCommandEl = document.getElementById('send-command');
    const sendDataEl = document.getElementById('send-data');

    const TERMINAL_STATUSES = new Set(['COMPLETED', 'COMPLETED_WITH_ERROR', 'CANCELLED', 'UNKNOWN']);
    let selectedMessageRow = null;
    let statusPollTimer = null;
    let statusPollDeadline = 0;

    function getToken() {
        return sessionStorage.getItem(TOKEN_KEY);
    }

    function authHeaders() {
        const t = getToken();
        const h = { 'Content-Type': 'application/json' };
        if (t) h['Authorization'] = 'Bearer ' + t;
        return h;
    }

    async function apiFetch(url, options) {
        const opts = options || {};
        const headers = new Headers(opts.headers || {});
        const t = getToken();
        if (t) headers.set('Authorization', 'Bearer ' + t);
        return fetch(url, Object.assign({}, opts, { headers: headers }));
    }

    function redirectToLogin(reason) {
        sessionStorage.removeItem(TOKEN_KEY);
        const q = reason ? ('?reason=' + encodeURIComponent(reason)) : '';
        location.href = '/admin/login.html' + q;
    }

    async function ensureManSession() {
        const t = getToken();
        if (!t) {
            redirectToLogin();
            return false;
        }
        const r = await fetch('/auth/me', { headers: { 'Authorization': 'Bearer ' + t } });
        if (!r.ok) {
            redirectToLogin();
            return false;
        }
        const me = await r.json();
        if (me.role !== 'MAN') {
            redirectToLogin('forbidden');
            return false;
        }
        userLine.textContent = DusterI18n.t('common.loggedInAs', { id: me.deviseId });
        return true;
    }

    document.getElementById('logout-btn').addEventListener('click', () => redirectToLogin());

    function showFlash(text, ok) {
        flash.textContent = text;
        flash.className = 'msg ' + (ok ? 'ok' : 'err');
        if (ok) setTimeout(() => { flash.className = 'msg'; flash.textContent = ''; }, 3500);
    }

    function escapeHtml(s) {
        if (s == null) return '';
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }

    function escapeAttr(s) {
        if (s == null) return '';
        return String(s)
            .replace(/&/g, '&amp;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;')
            .replace(/</g, '&lt;');
    }

    function statusBadgeClass(status) {
        if (status === 'DELIVERED' || status === 'COMPLETED') return 'badge status-ok';
        if (status === 'NOT_DELIVERED') return 'badge status-not';
        if (status === 'COMPLETED_WITH_ERROR' || status === 'CANCELLED') return 'badge status-warn';
        return 'badge status-muted';
    }

    function stopStatusPoll() {
        if (statusPollTimer) {
            clearInterval(statusPollTimer);
            statusPollTimer = null;
        }
        sendStopPoll.disabled = true;
        sendPollHintEl.textContent = '';
    }

    function fillMessageFilterSelect(devices) {
        const prev = msgFilterDevice.value;
        msgFilterDevice.innerHTML = '';
        const allOpt = document.createElement('option');
        allOpt.value = '';
        allOpt.textContent = DusterI18n.t('messages.allDevices');
        msgFilterDevice.appendChild(allOpt);
        for (const c of devices) {
            const opt = document.createElement('option');
            opt.value = c.deviseId;
            opt.textContent = c.deviseId + (c.description ? ' — ' + c.description : '');
            msgFilterDevice.appendChild(opt);
        }
        if (prev && [...msgFilterDevice.options].some(o => o.value === prev)) msgFilterDevice.value = prev;
    }

    function fillSendDeviceSelect(devices) {
        const prev = sendDevice.value;
        sendDevice.innerHTML = '';
        if (devices.length === 0) {
            const opt = document.createElement('option');
            opt.value = '';
            opt.textContent = DusterI18n.t('messages.noDevise');
            sendDevice.appendChild(opt);
            sendDevice.disabled = true;
            return;
        }
        sendDevice.disabled = false;
        const empty = document.createElement('option');
        empty.value = '';
        empty.textContent = DusterI18n.t('messages.choose');
        sendDevice.appendChild(empty);
        for (const c of devices) {
            const opt = document.createElement('option');
            opt.value = c.deviseId;
            opt.textContent = c.deviseId + (c.description ? ' — ' + c.description : '');
            sendDevice.appendChild(opt);
        }
        if (prev && devices.some(d => d.deviseId === prev)) sendDevice.value = prev;
    }

    async function loadClientsForDeviceSelects() {
        const r = await apiFetch(API_CLIENTS);
        if (r.status === 401 || r.status === 403) {
            redirectToLogin(r.status === 403 ? 'forbidden' : '');
            return;
        }
        if (!r.ok) {
            showFlash(DusterI18n.t('messages.flashClientsErr', { status: r.status }), false);
            return;
        }
        const list = await r.json();
        const devices = (list || []).filter(c => c.role === 'DEVISE');
        fillMessageFilterSelect(devices);
        fillSendDeviceSelect(devices);
    }

    function formatDateTime(ms) {
        if (ms == null) return '—';
        try {
            return new Date(ms).toLocaleString(DusterI18n.getLocaleTag(), { dateStyle: 'short', timeStyle: 'medium' });
        } catch (_) {
            return String(ms);
        }
    }

    function truncateDataJson(data) {
        if (data == null) return { text: '—', title: '' };
        let s;
        try {
            s = JSON.stringify(data);
        } catch (_) {
            s = String(data);
        }
        const text = s.length > 80 ? s.slice(0, 80) + '…' : s;
        return { text, title: s };
    }

    function ensureSendDeviceOption(deviseId) {
        if (!deviseId) return;
        if ([...sendDevice.options].some(o => o.value === deviseId)) return;
        const opt = document.createElement('option');
        opt.value = deviseId;
        opt.textContent = deviseId + DusterI18n.t('messages.fromHistory');
        sendDevice.appendChild(opt);
        sendDevice.disabled = false;
    }

    function applyMessageToSendForm(m) {
        stopStatusPoll();
        sendStatusPanel.style.display = 'none';
        ensureSendDeviceOption(m.deviseId);
        sendDevice.value = m.deviseId || '';
        const g = m.deliveryGuarantee;
        if (g && [...sendGuaranteeEl.options].some(o => o.value === g)) {
            sendGuaranteeEl.value = g;
        }
        sendCommandEl.value = m.command != null ? String(m.command) : '';
        if (m.data != null) {
            try {
                sendDataEl.value = JSON.stringify(m.data, null, 2);
            } catch (_) {
                sendDataEl.value = '';
            }
        } else {
            sendDataEl.value = '';
        }
        document.getElementById('send-form').scrollIntoView({ behavior: 'smooth', block: 'start' });
        showFlash(DusterI18n.t('messages.flashFilledFrom', { id: m.id }), true);
    }

    function selectMessageRow(tr, m) {
        if (selectedMessageRow) selectedMessageRow.classList.remove('msg-row-selected');
        selectedMessageRow = tr;
        tr.classList.add('msg-row-selected');
        applyMessageToSendForm(m);
    }

    async function loadMessages() {
        const limit = msgLimit.value || '200';
        let url = API_MESSAGES + '?limit=' + encodeURIComponent(limit);
        const fd = msgFilterDevice.value.trim();
        if (fd) url += '&deviseId=' + encodeURIComponent(fd);
        const r = await apiFetch(url);
        if (r.status === 401 || r.status === 403) {
            redirectToLogin(r.status === 403 ? 'forbidden' : '');
            return;
        }
        if (!r.ok) {
            showFlash(DusterI18n.t('messages.flashMessagesErr', { status: r.status }), false);
            return;
        }
        const list = await r.json();
        selectedMessageRow = null;
        messagesTbody.innerHTML = '';
        messagesEmpty.style.display = list.length ? 'none' : 'block';
        const yesWord = DusterI18n.t('common.yes');
        for (const m of list) {
            const dj = truncateDataJson(m.data);
            const tr = document.createElement('tr');
            tr.className = 'msg-row-clickable';
            tr.tabIndex = 0;
            tr.setAttribute('role', 'button');
            tr.setAttribute('aria-label', DusterI18n.t('messages.ariaApplyRow', { id: m.id }));
            tr.innerHTML =
                '<td>' + m.id + '</td>' +
                '<td><code>' + escapeHtml(m.deviseId) + '</code></td>' +
                '<td>' + escapeHtml(m.command) + '</td>' +
                '<td><span class="' + statusBadgeClass(m.deliveryStatus) + '">' + escapeHtml(m.deliveryStatus) + '</span></td>' +
                '<td><span class="badge">' + escapeHtml(m.deliveryGuarantee) + '</span></td>' +
                '<td>' + escapeHtml(formatDateTime(m.createdDate)) + '</td>' +
                '<td>' + escapeHtml(formatDateTime(m.deliveredDate)) + '</td>' +
                '<td>' + (m.deliveredError ? '<span class="badge status-warn">' + escapeHtml(yesWord) + '</span>' : '—') + '</td>' +
                '<td class="data-cell" title="' + escapeAttr(dj.title || dj.text) + '">' + escapeHtml(dj.text) + '</td>';
            tr.addEventListener('click', () => selectMessageRow(tr, m));
            tr.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    selectMessageRow(tr, m);
                }
            });
            messagesTbody.appendChild(tr);
        }
    }

    msgRefreshBtn.addEventListener('click', () => loadMessages());
    msgFilterDevice.addEventListener('change', () => loadMessages());
    msgLimit.addEventListener('change', () => loadMessages());

    async function fetchMessageStatus(messageId) {
        const r = await apiFetch('/producer/getMessageStatus/' + messageId);
        if (r.status === 401 || r.status === 403) {
            redirectToLogin(r.status === 403 ? 'forbidden' : '');
            return null;
        }
        if (r.status === 404) return null;
        if (!r.ok) return null;
        return r.json();
    }

    function renderSendStatus(messageId, status) {
        sendStatusPanel.style.display = 'block';
        sendMsgIdEl.innerHTML = '<strong>' + escapeHtml(DusterI18n.t('messages.msgId')) + '</strong> ' + escapeHtml(String(messageId));
        sendDeliveryStatusEl.innerHTML =
            '<strong>' + escapeHtml(DusterI18n.t('messages.deliveryStatus')) + '</strong> <span class="' + statusBadgeClass(status) + '">' +
            escapeHtml(status) + '</span>';
    }

    function startStatusPoll(messageId, initialStatus) {
        stopStatusPoll();
        renderSendStatus(messageId, initialStatus);
        if (TERMINAL_STATUSES.has(initialStatus)) {
            sendPollHintEl.textContent = DusterI18n.t('messages.pollFinal');
            return;
        }
        sendStopPoll.disabled = false;
        const maxMs = 120000;
        statusPollDeadline = Date.now() + maxMs;
        sendPollHintEl.textContent = DusterI18n.t('messages.pollRunning', { seconds: maxMs / 1000 });

        statusPollTimer = setInterval(async () => {
            if (Date.now() > statusPollDeadline) {
                stopStatusPoll();
                sendPollHintEl.textContent = DusterI18n.t('messages.pollTimeout');
                loadMessages();
                return;
            }
            const dto = await fetchMessageStatus(messageId);
            if (!dto || dto.deliveryStatus == null) return;
            const st = dto.deliveryStatus;
            renderSendStatus(messageId, st);
            if (TERMINAL_STATUSES.has(st)) {
                stopStatusPoll();
                sendPollHintEl.textContent = DusterI18n.t('messages.pollDone');
                loadMessages();
            }
        }, 1000);
    }

    sendStopPoll.addEventListener('click', () => {
        stopStatusPoll();
        sendPollHintEl.textContent = DusterI18n.t('messages.pollStopped');
    });

    sendForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (sendDevice.disabled) {
            showFlash(DusterI18n.t('messages.flashNoDevisePage'), false);
            return;
        }
        const deviseId = sendDevice.value.trim();
        if (!deviseId) {
            showFlash(DusterI18n.t('messages.flashPickDevice'), false);
            return;
        }
        const rawData = document.getElementById('send-data').value.trim();
        let data = null;
        if (rawData) {
            try {
                data = JSON.parse(rawData);
                if (data === null || typeof data !== 'object' || Array.isArray(data)) {
                    showFlash(DusterI18n.t('messages.flashDataObject'), false);
                    return;
                }
            } catch (_) {
                showFlash(DusterI18n.t('messages.flashBadJson'), false);
                return;
            }
        }
        const body = {
            believerGuarantee: document.getElementById('send-guarantee').value,
            command: document.getElementById('send-command').value.trim(),
            data: data
        };
        sendBtn.disabled = true;
        stopStatusPoll();
        sendStatusPanel.style.display = 'none';
        try {
            const pathDevise = encodeURIComponent(deviseId);
            const r = await apiFetch('/producer/request/' + pathDevise, {
                method: 'PUT',
                headers: authHeaders(),
                body: JSON.stringify(body)
            });
            if (r.status === 401 || r.status === 403) {
                redirectToLogin(r.status === 403 ? 'forbidden' : '');
                return;
            }
            if (!r.ok) {
                let msg = r.status + ' ' + r.statusText;
                try {
                    const err = await r.json();
                    if (err.message) msg = err.message;
                    else if (err.error) msg = err.error;
                } catch (_) {}
                showFlash(msg, false);
                return;
            }
            const out = await r.json();
            const mid = out.id;
            const st = out.deliveryStatus || 'NOT_DELIVERED';
            showFlash(DusterI18n.t('messages.flashCreated', { id: mid }), true);
            startStatusPoll(mid, st);
            loadMessages();
        } finally {
            sendBtn.disabled = false;
        }
    });

    (async function init() {
        if (!(await ensureManSession())) return;
        await loadClientsForDeviceSelects();
        await loadMessages();
    })();
</script>
</body>
</html>
