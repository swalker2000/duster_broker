mqtt:
  broker:
    url: ${MQTT_BROKER_URL:ssl://localhost:8883}
    username: ${MQTT_BROKER_USERNAME:ADMIN1}  # Если не требуется, оставьте пустым
    password: ${MQTT_BROKER_PASSWORD:12345}  # Если не требуется, оставьте пустым
  ssl:
    insecure: ${MQTT_SSL_INSECURE:false}
  qos: ${MQTT_QOS:1}  # Опционально, QoS по умолчанию
server:
    address: ${REST_SERVER_ADDRESS:127.0.0.1}

duster:
  protocol:
    tcp:
      enabled: ${DUSTER_PROTOCOL_TCP_ENABLED:true}
      port: ${DUSTER_PROTOCOL_TCP_PORT:9091}
    tls:
      enabled: ${DUSTER_PROTOCOL_TLS_ENABLED:true}
      port: ${DUSTER_PROTOCOL_TLS_PORT:9092}
      keystore: ${DUSTER_PROTOCOL_TLS_KEYSTORE:}
      keystore-password: ${DUSTER_PROTOCOL_TLS_KEYSTORE_PASSWORD:}

common:
  checkNotDeliveredTimeout: ${COMMON_CHECK_NOT_DELIVERED_TIMEOUT:60000}
  mqttWaitResponseTimeout: ${COMMON_MQTT_WAIT_RESPONSE_TIMEOUT:30000}
  sendMessagePeriod: ${COMMON_SEND_MESSAGE_PERIOD:2000}
  consumerTimeout: ${COMMON_CONSUMER_TIMEOUT:2000}
  messageSendTimeCash:
    collectorRunPeriod: ${COMMON_MESSAGE_SEND_TIME_CASH_COLLECTOR_RUN_PERIOD:3600000}

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/duster}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:create}

# Для HS256 секрет должен быть ≥ 256 бит (32+ байта в UTF-8). В проде задайте JWT_SECRET.
app:
  jwt:
    secret: ${JWT_SECRET:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  security:
    permit-all: ${APP_SECURITY_PERMIT_ALL:false}